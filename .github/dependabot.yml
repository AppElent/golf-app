# Dependabot handles security fixes and routine minor/patch bumps. Majors and
# Expo SDK-aligned packages go through the upgrade-dependencies skill.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace
    # Root only: Dependabot reads the `packages:` globs in pnpm-workspace.yaml
    # and updates apps/mobile and packages/core from here. A workspace
    # subdirectory entry fails with `misconfigured_tooling`.
    directory: "/"
    schedule: { interval: weekly, day: monday }
    # Must stay >= minimumReleaseAge in pnpm-workspace.yaml (3 days), or the
    # proposed lockfile fails `pnpm install --frozen-lockfile`.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      # Each update joins the first group it matches, so packages linked by a peer
      # dependency share a group listed before the dependency-type groups; split
      # across dev and prod, each PR fails CI. Ignore entries still apply inside a
      # group.
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
        update-types: [minor, patch]
      convex:
        patterns: ["convex", "convex-test", "convex-helpers"]
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Every ignore names update-types: a bare dependency-name ignore would also
    # block security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Versions pinned by the Expo SDK; upgrade with `expo install --fix`.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
