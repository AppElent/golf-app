name: Setup
description: pnpm, Node and the workspace's frozen install. Run after actions/checkout.
runs:
  using: composite
  steps:
    # pnpm's version comes from package.json's packageManager.
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    # The one Node version for CI, deploys and mobile workflows.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version: 22, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
