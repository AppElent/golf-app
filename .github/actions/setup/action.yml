name: Setup
description: pnpm, Node and the workspace's frozen install. Run after actions/checkout.
runs:
  using: composite
  steps:
    # pnpm's version comes from package.json's packageManager.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    # The one Node version for CI, deploys and mobile workflows.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version: 22, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
