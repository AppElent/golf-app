name: Setup
description: pnpm, Node and the workspace's frozen install. Run after actions/checkout.
runs:
  using: composite
  steps:
    # pnpm's version comes from package.json's packageManager.
    - uses: pnpm/action-setup@v4
    # The one Node version for CI, deploys and mobile workflows.
    - uses: actions/setup-node@v4
      with: { node-version: 22, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
