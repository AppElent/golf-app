name: CI
# Pull requests here; on main, deploy.yml calls this as its first job, so a
# merge is checked once and deploys only when the checks pass.
on:
  pull_request:
  workflow_call:
# A newer push supersedes a PR's checks; a deploy's checks always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # Manifest and .env.example only; needs no credentials.
      - run: pnpm env:check
      # Toolkit conformance; any new drift fails the PR.
      - run: node scripts/check-project.mjs --strict
      # The gate agents run locally: check, typecheck (web, convex,
      # packages/core, apps/mobile), test and test:mobile in one root script.
      - run: pnpm verify
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss, before deploy.yml builds again with real environment values.
      # No SENTRY_AUTH_TOKEN or DSN: this artifact is never deployed, so it
      # uploads no source maps and creates no Sentry release.
      - run: pnpm build
        env:
          VITE_SENTRY_ENVIRONMENT: ci
