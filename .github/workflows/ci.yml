name: CI
# Pull requests here; on main, deploy.yml calls this as its first job, so a
# merge is checked once and deploys only when the checks pass.
on:
  pull_request:
  workflow_call:
# A newer push supersedes a PR's checks; a deploy's checks always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm test:mobile
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss, before deploy.yml builds again with real environment values.
      - run: pnpm build
