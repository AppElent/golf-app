name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm test:mobile
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss. preview.yml only builds on pull_request, so without this a build-only
      # failure could land green on a direct push to main.
      # No SENTRY_AUTH_TOKEN or DSN: this artifact is never deployed, so it
      # uploads no source maps and creates no Sentry release. The environment
      # tag keeps it from passing for a deployment if it is ever run.
      - run: pnpm build
        env:
          VITE_SENTRY_ENVIRONMENT: ci
