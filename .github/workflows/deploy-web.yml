name: Deploy web

# One web target. Production: Convex functions, the course catalog, then the
# Worker, so the backend is complete before the new frontend can be reached.
# Staging is a frontend on the production Convex deployment: it builds against
# the production URL and ships only its Worker. Called by deploy.yml for
# `staging` and `production`.
on:
  workflow_call:
    inputs:
      # The GitHub Environment, also the Wrangler env (production = top level).
      environment: { type: string, required: true }
      # The Worker this target must build; the deploy refuses any other.
      worker: { type: string, required: true }
      # The Worker's custom domain; empty means its workers.dev URL.
      url: { type: string, default: "" }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.worker.outputs.url }}
    permissions:
      contents: read
    env:
      # Every value is scoped to the GitHub Environment, written by
      # `pnpm env:apply <environment> --only github` (env.manifest.ts).
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      # The deploy key alone picks the Convex deployment. Production only: a
      # staging job would also inherit any repository secret of this name, so
      # withholding it here is what stops a merge changing the backend.
      CONVEX_DEPLOY_KEY: ${{ inputs.environment == 'production' && secrets.CONVEX_DEPLOY_KEY || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      # Staging only: the production deployment's URL. Production gets it from
      # convex deploy below.
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
      # The Cloudflare Vite plugin picks the Wrangler env at build time and
      # `wrangler deploy` follows dist/server/wrangler.json; --env is ignored.
      CLOUDFLARE_ENV: ${{ inputs.environment != 'production' && inputs.environment || '' }}
      EXPECTED_WORKER: ${{ inputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Fails before anything ships rather than deploying half a target. An
      # Environment without its own CONVEX_DEPLOY_KEY would inherit a
      # repository one, so production checks the prefix too.
      - name: Check environment
        run: |
          if [ "$ENVIRONMENT_NAME" = production ]; then
            case "$CONVEX_DEPLOY_KEY" in
              prod:*) ;;
              *) echo "::error::CONVEX_DEPLOY_KEY in the production Environment is missing or not a prod: key."; exit 1 ;;
            esac
          fi
          node scripts/env.mjs check "$ENVIRONMENT_NAME" --ci

      # Convex exposes the deployment's URL to --cmd as $CONVEX_URL; the app
      # reads VITE_CONVEX_URL at build time. Both targets build in production
      # mode: staging exists to run the bundle production ships. The hidden
      # source maps upload when SENTRY_AUTH_TOKEN is set (docs/runbooks/sentry.md).
      - name: Convex deploy + build
        if: inputs.environment == 'production'
        run: |
          # shellcheck disable=SC2016 # $CONVEX_URL expands inside convex deploy
          pnpm exec convex deploy \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd 'VITE_CONVEX_URL=$CONVEX_URL pnpm build'

      - name: Sync course catalog
        if: inputs.environment == 'production'
        run: pnpm exec convex run courseCatalog:sync

      # VITE_CONVEX_URL comes from the staging Environment, as the production URL.
      - name: Build staging
        if: inputs.environment != 'production'
        run: pnpm build

      # A build for the wrong env would replace another environment's Worker.
      - name: Guard Worker name
        run: |
          built=$(jq -r .name dist/server/wrangler.json)
          if [ "$built" != "$EXPECTED_WORKER" ]; then
            echo "::error::Built Worker is $built, expected $EXPECTED_WORKER. Check CLOUDFLARE_ENV."
            exit 1
          fi

      - name: Deploy Worker
        id: worker
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          url="${{ inputs.url }}"
          [ -n "$url" ] || url=$(grep -oE "https://$EXPECTED_WORKER\.[^ ]+workers\.dev" "$RUNNER_TEMP/wrangler.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke check
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::No URL for $EXPECTED_WORKER: wrangler printed no workers.dev URL and no url input was given."
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} $URL\n" "$URL"
