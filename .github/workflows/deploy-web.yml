name: Deploy web

# One web target: Convex functions, the course catalog, then the Worker. The
# backend is complete before the new frontend can be reached. Called by
# deploy.yml for `stg` and `production`.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      # wrangler.jsonc env block; empty means the top-level `golf-app` Worker.
      # The Cloudflare Vite plugin resolves it at build time (CLOUDFLARE_ENV)
      # into dist/server/wrangler.json; `wrangler deploy --env` is ignored.
      wrangler-env: { type: string, default: "" }
      # The Worker's custom domain; empty means its workers.dev URL.
      url: { type: string, default: "" }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.worker.outputs.url }}
    permissions:
      contents: read
      packages: read
    env:
      # The deploy key alone picks the Convex deployment.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public, inlined into the bundle: a variable, not a secret.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      CLOUDFLARE_ENV: ${{ inputs.wrangler-env }}
      WORKER_NAME: golf-app${{ inputs.wrangler-env && format('-{0}', inputs.wrangler-env) || '' }}
    steps:
      # Fails before anything ships rather than deploying half a target.
      - name: Check environment
        run: |
          missing=0
          for name in CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the '${{ inputs.environment }}' GitHub Environment (or the repo)."
              missing=1
            fi
          done
          case "$CONVEX_DEPLOY_KEY" in
            prod:*|"") ;;
            *) echo "::error::CONVEX_DEPLOY_KEY on '${{ inputs.environment }}' must be a prod: key (convex deployment create … --type prod)."; missing=1 ;;
          esac
          exit $missing

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Convex exposes the deployment's URL to --cmd as $CONVEX_URL; the app
      # reads VITE_CONVEX_URL at build time. Both targets build in production
      # mode: staging exists to run the bundle production ships.
      - name: Convex deploy + build
        run: |
          # shellcheck disable=SC2016 # $CONVEX_URL expands inside convex deploy
          pnpm exec convex deploy \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd 'VITE_CONVEX_URL=$CONVEX_URL pnpm build'

      - name: Sync course catalog
        run: pnpm exec convex run courseCatalog:sync

      - name: Deploy Worker
        id: worker
        run: |
          set -o pipefail
          built=$(jq -r .name dist/server/wrangler.json)
          if [ "$built" != "$WORKER_NAME" ]; then
            echo "::error::Build targets Worker '$built', expected '$WORKER_NAME'."
            exit 1
          fi
          pnpm exec wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          url="${{ inputs.url }}"
          [ -n "$url" ] || url=$(grep -oE "https://$WORKER_NAME\.[^ ]+workers\.dev" "$RUNNER_TEMP/wrangler.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke check
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::No URL for $WORKER_NAME: wrangler printed no workers.dev URL and no url input was given."
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} $URL\n" "$URL"
