name: Mobile runtime

# From the mobile-baseline template (docs/standards/mobile-baseline/templates/
# mobile-runtime.yml), with a `check` step.
#
# Says on each PR whether it changes the app's runtime fingerprint. If it
# does, installed builds can't load the PR as an over-the-air update and a
# new build is due after merging; if not, the merge ships as an update. The
# comparison is informational and never fails a PR for changing native code.
#
# `check` does fail a PR: when a fingerprint has no Expo-autolinked module
# (APP-71), or a package in WATCHED (apps/mobile/scripts/fingerprint.mjs)
# drops out of one, such as `@clerk/expo` or the `expo-application` module
# Clerk's minimum-version check reads the build's version from. The
# comparison also lists their version changes.
on:
  pull_request:
    paths:
      - apps/mobile/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-runtime.yml

concurrency:
  group: mobile-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      # Native modules are fingerprinted from node_modules, so both sides
      # need their own install. The second one comes from the pnpm store.
      - uses: ./.github/actions/setup
      # A base without the app needs no install; fingerprint.mjs says so.
      - name: Install base
        run: |
          if [ -f .base/apps/mobile/package.json ]; then
            cd .base && pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Compare fingerprints
        run: |
          node apps/mobile/scripts/fingerprint.mjs diff .base > "$RUNNER_TEMP/runtime.md"
          cat "$RUNNER_TEMP/runtime.md" >> "$GITHUB_STEP_SUMMARY"

      # Dependabot and fork runs get a read-only token; the summary still has it.
      - name: Upsert PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- mobile-runtime -->';
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/runtime.md`, 'utf8')}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      # Last, so a failure still leaves the comparison on the PR.
      - name: Native modules and watched packages are fingerprinted
        run: node apps/mobile/scripts/fingerprint.mjs check
