name: Deploy

# A merge to main: checks → staging → production (waits for approval) →
# mobile update. Production deploys the commit staging just ran, through the
# same steps; the approval is the `production` GitHub Environment's required
# reviewer. Releases queue rather than cancel: a newer merge waiting behind
# another replaces the older waiting one.
#
# Each target's values are environment-scoped: the `staging` and `production`
# GitHub Environments hold the same names with their own values, written by
# `pnpm env:apply <environment> --only github`, so deploy-web.yml names each
# once. Repository scope holds only PREVIEW_ names (preview.yml), so a missing
# Environment value never falls back to a preview one.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  staging:
    needs: checks
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: staging
      # Predates the standard golf-app-staging name (env.manifest.ts).
      worker: golf-app-stg
    secrets: inherit

  production:
    needs: staging
    # Only main reaches production, also from a manual run.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: production
      worker: golf-app
      url: https://fairway.appelent.nl
    secrets: inherit

  mobile:
    needs: production
    uses: ./.github/workflows/mobile-update.yml
    permissions:
      contents: write
    secrets: inherit
