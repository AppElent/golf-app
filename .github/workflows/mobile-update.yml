name: Mobile Update

# Publishes the app's JavaScript to the `preview` update channel, the one the
# owner's daily-driver build (`preview-internal`) follows. deploy.yml calls it
# after the production deploy: `preview` builds talk to production Convex, so
# the update must not land before the functions it calls.
#
# Skipped when nothing the app bundles changed since the last publish (the
# `mobile-ota/preview` tag), so a web-only release does not show "Update
# ready" for nothing.
#
# Gated by the runtime fingerprint, per platform: an update is published only
# when something on the channel already runs this fingerprint — an earlier
# update, or a finished EAS build. A native change (new module, config
# plugin, SDK bump) changes the fingerprint; the job then skips that platform
# and says a rebuild is due. The job fails before publishing when a
# fingerprint misses Expo's autolinked modules or a WATCHED package
# (`fingerprint.mjs check`), since such a fingerprint would not change with
# native code.
#
# Local builds (`eas build --local`) are not recorded on EAS, so after
# installing one, run this workflow by hand with `force` to seed the channel.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when nothing changed or no build on the channel has this fingerprint
        type: boolean
        default: false

concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Moves the mobile-ota/preview tag.
      contents: write
    env:
      # Repository scope, written by `pnpm env:apply preview --only github`.
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      APP_VARIANT: preview
      CHANNEL: preview
      TAG: mobile-ota/preview
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::PREVIEW_EXPO_TOKEN is not set. Store expo-token in Infisical and run pnpm env:apply preview --only github."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed since last publish
        id: changed
        working-directory: .
        run: |
          if [ "$FORCE" != true ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null &&
            git diff --quiet "$TAG" HEAD -- apps/mobile packages/core pnpm-lock.yaml; then
            echo "Nothing the app bundles changed since \`$TAG\`; no update published." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.changed.outputs.changed == 'true'

      # The gate below trusts the fingerprint to change with native code. Stop,
      # even with `force`, when it can't: a fingerprint without Expo's
      # autolinked modules (as @expo/fingerprint 0.21.7 produced on Android,
      # APP-71) matches builds that lack an added module's native code.
      - name: Fingerprints cover native modules
        if: steps.changed.outputs.changed == 'true'
        run: node scripts/fingerprint.mjs check

      - name: Match fingerprints
        id: match
        if: steps.changed.outputs.changed == 'true'
        run: |
          publish=()
          for platform in ios android; do
            runtime=$(pnpm exec expo-updates runtimeversion:resolve --platform "$platform" | jq -r .runtimeVersion)
            updates=$(pnpm exec eas update:list --branch "$CHANNEL" --runtime-version "$runtime" \
              --limit 50 --json --non-interactive 2>/dev/null \
              | jq --arg p "$platform" '[.currentPage[]? | select(.platforms | contains($p))] | length' || echo 0)
            builds=$(pnpm exec eas build:list --platform "$platform" --channel "$CHANNEL" \
              --runtime-version "$runtime" --status finished --limit 1 --json --non-interactive 2>/dev/null \
              | jq length || echo 0)
            if [ "${updates:-0}" -gt 0 ] || [ "${builds:-0}" -gt 0 ] || [ "$FORCE" = true ]; then
              publish+=("$platform")
              echo "- $platform \`${runtime:0:12}\`: publishing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $platform \`${runtime:0:12}\`: **native change, rebuild \`preview-internal\`** (no update or build on \`$CHANNEL\` has this fingerprint)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "platforms=${publish[*]}" >> "$GITHUB_OUTPUT"

      - name: eas update
        if: steps.match.outputs.platforms != ''
        env:
          # The preview environment's Sentry token is for builds; source maps
          # for updates are not uploaded yet.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          message=$(git log -1 --format=%s)
          for platform in ${{ steps.match.outputs.platforms }}; do
            pnpm exec eas update --channel "$CHANNEL" --environment preview \
              --platform "$platform" --non-interactive --message "$message"
          done
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
