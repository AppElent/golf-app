name: Dependabot blast radius
# Toolkit template (docs/standards/dependency-updates.md). Copy it unchanged to
# .github/workflows/dependabot-blast-radius.yml; it holds nothing app-specific.
#
# Labels each Dependabot PR with its blast radius:
# - blast-radius:low: every updated dependency is a patch and nothing CI-related
#   changes.
# - blast-radius:med: anything else. That covers minor, major, empty or
#   unknown update types (also when only one entry of a grouped PR has one),
#   a failed metadata step, a github_actions update, and any change to a file
#   under .github/.
# - An existing blast-radius:high is never lowered or joined by low or med.
# Human and agent PRs are skipped, so their labels are never touched. The
# workflow creates no labels: the three blast-radius:* labels must exist (the
# standard's setup step), or the edit fails and the run turns red.
#
# Plain `pull_request`, never `pull_request_target`: Dependabot runs get a
# read-only token, which the job's `permissions` raise only as far as needed.
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions: {}
# One group per PR and no cancelling. With cancel-in-progress: true, a push
# (by Dependabot or a person) cancels the run still labeling the previous
# push. GitHub keeps at most one running and one pending run per group: a
# newer pending run replaces an older pending one, and the run in progress
# finishes. The last run to start always belongs to the newest push and reads
# the PR's files and labels from the API when it runs, so it labels the PR's
# final state.
concurrency:
  group: dependabot-blast-radius-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    # Gated on the PR author, not the actor: a person pushing to a Dependabot
    # PR still relabels it. fetch-metadata then rejects the non-Dependabot
    # commit, its outputs are empty, and the PR gets med.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        # If metadata cannot be read, outputs are empty and the PR gets med.
        continue-on-error: true
      - name: Apply blast-radius label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          patch=version-update:semver-patch
          # update-type is fetch-metadata's largest type in the group, but it
          # skips entries with an empty type: patch + unknown reports patch.
          # So low also needs every entry of the group to be a patch.
          all_patch=false
          if jq -e --arg p "$patch" 'type == "array" and length > 0 and all(.[]; .updateType == $p)' \
            <<<"${DEPENDENCIES:-null}" >/dev/null 2>&1; then
            all_patch=true
          fi
          # Captured first: `gh ... | grep -q` can fail under pipefail when
          # grep exits early and gh gets SIGPIPE.
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename')
          ci=false
          if [ "$ECOSYSTEM" = "github_actions" ] || grep -q '^\.github/' <<<"$files"; then
            ci=true
          fi
          if [ "$UPDATE_TYPE" = "$patch" ] && [ "$all_patch" = true ] && [ "$ci" = false ]; then
            want=blast-radius:low; stale=blast-radius:med
          else
            want=blast-radius:med; stale=blast-radius:low
          fi
          echo "update-type='$UPDATE_TYPE' all-patch=$all_patch ecosystem='$ECOSYSTEM' ci=$ci -> $want"
          # Read the labels now, not from the event payload, so a label set
          # while this run waited (blast-radius:high above all) is respected.
          labels=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name')
          if grep -qx 'blast-radius:high' <<<"$labels"; then
            echo "blast-radius:high is set; leaving labels alone."
            exit 0
          fi
          args=(--add-label "$want")
          # A rebase can change the update type; drop the other label.
          if grep -qx "$stale" <<<"$labels"; then args+=(--remove-label "$stale"); fi
          gh pr edit "$PR" "${args[@]}"
