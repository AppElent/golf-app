name: PR Preview

# Opt-in: a PR gets a preview backend + Worker only while it carries the
# `preview:web` label. Pushes to a labelled PR redeploy; removing the label or
# closing the PR deletes the Worker. Close always cleans up, so Workers from
# before the label gate are not left behind. Other label changes are ignored.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

jobs:
  deploy:
    # Fork and Dependabot runs get no Actions secrets, so a deploy cannot work.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    # Job-level, so a run whose jobs are all skipped (an unrelated label) does
    # not cancel an in-flight deploy. Cleanup shares the group and supersedes it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      packages: read
    env:
      WORKER_NAME: golf-app-pr-${{ github.event.pull_request.number }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm


      - run: pnpm install --frozen-lockfile

      # Convex provisions/refreshes preview backend pr-<N>, exposes its URL as
      # $CONVEX_URL inside --cmd, runs the build (bridging CONVEX_URL ->
      # VITE_CONVEX_URL since the app reads the Vite-prefixed var at build
      # time), then seeds the fresh backend so the preview isn't empty.
      - name: Convex preview deploy + build + seed
        # Sentry: the deployed preview reports as `preview`, and its hidden
        # source maps upload when the token is set (see docs/runbooks/sentry.md).
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          pnpm exec convex deploy \
            --preview-create pr-${{ github.event.pull_request.number }} \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd 'VITE_CONVEX_URL=$CONVEX_URL VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY pnpm build' \
            --preview-run seedPreview:seedPreview

      - name: Deploy Worker (per-PR)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # --var overrides the runtime bindings so the per-PR Worker matches
          # the per-PR bundle - otherwise wrangler.jsonc's top-level `vars`
          # (if any) would bake production values onto the preview Worker.
          pnpm exec wrangler deploy \
            --name "$WORKER_NAME" \
            --var "VITE_CLERK_PUBLISHABLE_KEY:$VITE_CLERK_PUBLISHABLE_KEY" \
            --var "environment_name:preview" \
            2>&1 | tee /tmp/wrangler-deploy.log
          URL=$(grep -oE 'https://[^ ]+workers\.dev' /tmp/wrangler-deploy.log | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n### Preview\n- App: ${process.env.URL}\n- Convex preview: \`pr-${process.env.PR}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Close always runs cleanup, so a PR that never deployed has no Worker.
        # Tolerate only that; any other failure must stay visible.
        run: |
          status=0; out=$(pnpm exec wrangler delete --name "golf-app-pr-${{ github.event.pull_request.number }}" 2>&1) || status=$?
          echo "$out"
          # Wrangler reports a missing Worker as code 10007 ("This Worker does not exist").
          [ "$status" -eq 0 ] || echo "$out" | grep -qE "10007|does not exist" || exit "$status"
      # Convex preview deployments idle-expire automatically (~14 days).
      # No reliable CLI delete today; prune from the dashboard if needed.
