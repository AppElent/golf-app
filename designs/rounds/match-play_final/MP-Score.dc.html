<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Scoreformulier: matchplay en skins</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#e4e7e1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
.th-light{--bg:#f3f4ef;--surface:#ffffff;--surface2:#e7ebe3;--accent:#1a7348;--accentFill:#1a7348;--onAccent:#ffffff;--accentDim:rgba(26,115,72,.10);--accentInk:#1c6b45;--text:#16241c;--muted:#506157;--faint:#606b57;--sep:rgba(60,62,50,.12);--borderStrong:rgba(26,32,21,.25);--danger:#b42332}
.th-dark{--bg:#08130d;--surface:#11201a;--surface2:#1a2c23;--accent:#3fbf7a;--accentFill:#3fbf7a;--onAccent:#06110b;--accentDim:rgba(63,191,122,.14);--accentInk:#7fe0a6;--text:#f1f5f0;--muted:#9aaa9f;--faint:#919789;--sep:rgba(255,255,255,.14);--borderStrong:rgba(255,255,255,.18);--danger:#ff6b6b}
.board{display:flex;gap:48px;padding:32px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-size:14px;font-weight:600;color:#36423b}
.phone{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#2b3a31;color:var(--text);border:1px solid rgba(0,0,0,.18)}
.sheet{position:absolute;left:0;right:0;top:54px;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:center;min-height:52px;padding:0 8px}
.sh-a{min-width:76px;min-height:44px;border:0;background:none;font:500 17px/1 inherit;color:var(--muted);text-align:left;padding:0 8px}
.sh-s{color:var(--accent);font-weight:700;text-align:right}
.sh-t{flex:1;text-align:center;font-size:18px;font-weight:700}
.body{padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.stand{background:var(--accentDim);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stand b{font-size:17px;color:var(--text)}
.stand span{font-size:13px;color:var(--muted)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accentDim);border-radius:999px;padding:2px 8px}
.grp{background:var(--surface);border-radius:12px}
.step{display:flex;align-items:center;min-height:52px;padding:0 12px 0 16px;font-size:17px;gap:10px}
.sb{width:36px;height:36px;border-radius:18px;border:0;background:var(--surface2);color:var(--text);font:600 20px/1 inherit}
.sv{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.net{font-size:13px;color:var(--muted)}
.res{border:1px solid var(--borderStrong);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.res b{font-size:16px}
.res span{font-size:13px;color:var(--muted)}
</style>
</helmet>
<div class="board">
<sc-for list="{{phones}}" as="ph" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{ph.label}}</div>
<div class="phone {{ph.cls}}">
<div class="sheet">
<div class="sh-h"><button class="sh-a" type="button">Annuleren</button><span class="sh-t">Hole 11 · Par 4</span><button class="sh-a sh-s" type="button">Opslaan</button></div>
<div class="body">
<div class="stand" role="status"><b>{{ph.stand}}</b><span>{{ph.standSub}}</span></div>
<sc-for list="{{ph.players}}" as="p" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:6px">
<div class="lbl">{{p.name}}<sc-if value="{{p.stroke}}" hint-placeholder-val="{{false}}"><span class="dot">+1 slag</span></sc-if></div>
<div class="grp step">Slagen<span style="margin-left:auto" class="net">{{p.net}}</span><button class="sb" type="button" aria-label="Minder">−</button><span class="sv">{{p.s}}</span><button class="sb" type="button" aria-label="Meer">+</button></div>
</div>
</sc-for>
<div class="res" role="status"><b>{{ph.res}}</b><span>{{ph.resSub}}</span></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":892,"height":940}}'>
class Component extends DCLogic {
renderVals() {
return { phones: [
{ label: "Licht · matchplay, netto", cls: "th-light", stand: "Eric 1 UP", standSub: "Nog 8 holes · Piet krijgt een slag op deze hole (HCP 3)",
  players: [{ name: "Eric", s: 5, net: "", stroke: false }, { name: "Piet", s: 5, net: "netto 4", stroke: true }],
  res: "Piet wint de hole · All square", resSub: "Netto 4 tegen 5. Opslaan zet de stand op All square, nog 7 holes." },
{ label: "Donker · skins, netto, doorschuiven aan", cls: "th-dark", stand: "Skin op hole 11 is 3 waard", standSub: "2 doorgeschoven van hole 9 en 10",
  players: [{ name: "Eric", s: 4, net: "", stroke: false }, { name: "Piet", s: 5, net: "netto 4", stroke: true }, { name: "Jan", s: 6, net: "netto 5", stroke: true }],
  res: "Gelijk: Eric en Piet netto 4", resSub: "Niemand wint alleen, dus de skin schuift door. Hole 12 is 4 waard." }
] };
}
}
</script>
</body>
</html>
