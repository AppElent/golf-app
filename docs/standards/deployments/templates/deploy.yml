# Adapt before use: APP_NAME, the staging Wrangler environment (or drop the
# staging branch of each expression), extra VITE_* values, SMOKE_URL, and
# post-deploy steps such as seeds. Pairs with environments.md (the GitHub
# Environments and their values) and the CI workflow, which must accept
# `workflow_call`.
name: Deploy

# Default dispatch, used below: push to main deploys staging (or production
# when there is no staging); workflow_dispatch deploys production from main only.
# Alternate dispatch, for a repo that already has it: a production job needs
# the staging job, sets environment: production, and runs only on main. That
# chain is that repo's production path. Keep whichever dispatch the repo
# already uses. Do not add the other path for the same commit.
#
# The production GitHub Environment restricts deploys to main and has no
# required reviewers: approvals happen before the merge or dispatch, on a
# decision card in the Developer Home project chat, never in the Actions UI.
# Remove them only when the owner opts into autonomous production deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the previous one instead.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  # Required checks can be bypassed by admins, so check again before shipping.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
    permissions: { contents: read }
    env:
      # Every value is scoped to the GitHub Environment; this file names each
      # once and never selects between environments with expressions.
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # Custom domain for the smoke check. Empty falls back to the workers.dev
      # URL wrangler prints. Set it on each GitHub Environment that has one.
      SMOKE_URL: ${{ vars.SMOKE_URL }}
      # The Cloudflare Vite plugin picks the Wrangler env at build time and
      # `wrangler deploy` follows dist/server/wrangler.json; --env is ignored.
      # wrangler.jsonc: top-level = APP_NAME (production), env.staging = APP_NAME-staging.
      CLOUDFLARE_ENV: ${{ github.event_name != 'workflow_dispatch' && 'staging' || '' }}
      EXPECTED_WORKER: ${{ github.event_name == 'workflow_dispatch' && 'APP_NAME' || 'APP_NAME-staging' }}
    steps:
      - name: Guard production ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys run from main only (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # An Environment without its own CONVEX_DEPLOY_KEY silently inherits a
      # repo-level one (often the preview key), so check the prefix first.
      - name: Check environment
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "::error::CONVEX_DEPLOY_KEY in the $ENVIRONMENT_NAME Environment is missing or not a prod: key."; exit 1 ;;
          esac
          node scripts/env.mjs check "$ENVIRONMENT_NAME" --ci

      # The deploy key alone picks the Convex deployment, which exposes its URL
      # to --cmd as $CONVEX_URL; the build reads VITE_CONVEX_URL.
      - name: Convex deploy + build
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd "VITE_CONVEX_URL=\$CONVEX_URL pnpm build"

      # A build for the wrong env would replace another environment's Worker.
      - name: Guard Worker name
        run: |
          built=$(jq -r .name dist/server/wrangler.json)
          if [ "$built" != "$EXPECTED_WORKER" ]; then
            echo "::error::Built Worker is $built, expected $EXPECTED_WORKER. Check CLOUDFLARE_ENV."
            exit 1
          fi

      - name: Deploy Worker
        id: worker
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          url="$SMOKE_URL"
          [ -n "$url" ] || url=$(grep -oE "https://$EXPECTED_WORKER\.[^ ]+workers\.dev" "$RUNNER_TEMP/wrangler.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke check
        env:
          URL: ${{ steps.worker.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::No smoke URL for $EXPECTED_WORKER. Set SMOKE_URL on this Environment, or confirm wrangler printed a workers.dev URL."
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} $URL\n" "$URL"
