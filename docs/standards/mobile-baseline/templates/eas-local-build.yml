# Adapt APP_NAME and MOBILE_DIR (the Expo app directory) before use. Requires
# eas-cli as a pinned dev dependency; `pnpm exec` does not download it.
name: EAS local build

# `eas build --local` runs the EAS build steps on this GitHub runner, so it
# spends no EAS Build credits. It still talks to EAS for the project, the
# profile's environment variables (not "Secret"-visibility ones) and managed
# signing credentials, which is why it needs EXPO_TOKEN.
on:
  workflow_call:
    inputs:
      platform: { type: string, required: true }
      profile: { type: string, default: development }

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Builds that need uploaded source maps stay on the EAS cloud flow.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      ARTIFACT: APP_NAME-${{ inputs.platform }}-${{ inputs.profile }}.${{ inputs.platform == 'ios' && 'ipa' || 'apk' }}
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm

      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.platform == 'ios'
        with:
          xcode-version: latest-stable

      - run: pnpm install --frozen-lockfile

      - name: eas build --local
        working-directory: MOBILE_DIR
        run: |
          pnpm exec eas build --local --non-interactive \
            --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --output "$RUNNER_TEMP/$ARTIFACT"

      # Artifact names reject `/`, so manual runs use the run id, not the branch.
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ env.ARTIFACT }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### ${{ inputs.platform }} \`${{ inputs.profile }}\` build" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download $ARTIFACT](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
