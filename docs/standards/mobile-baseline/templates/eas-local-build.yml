# Adapt APP_NAME and MOBILE_DIR (the Expo app directory) before use. Requires
# eas-cli as a pinned dev dependency; `pnpm exec` does not download it.
name: EAS local build

# `eas build --local` runs the EAS build steps on this GitHub runner, so it
# spends no EAS Build credits. It still talks to EAS for the project, the
# profile's environment variables (not "Secret"-visibility ones) and managed
# signing credentials, which is why it needs EXPO_TOKEN.
on:
  workflow_call:
    inputs:
      platform: { type: string, required: true }
      profile: { type: string, default: development }
      # Build even when production Convex lacks this commit's Convex changes.
      allow_convex_drift: { type: boolean, default: false }

jobs:
  # A profile that talks to production Convex ships this commit's JavaScript,
  # so production must already run every Convex change it calls. The repo's
  # scripts/eas-build-convex-guard.mjs decides per profile (from eas.json) and
  # compares HEAD with the last successful `production` GitHub deployment:
  # exit 0 in step or no check needed, 1 drift, 2 could not tell (reference:
  # AppElent/workouts). Without that script the job only notes it and passes.
  # It runs on Ubuntu before the build spends macOS time, and keeps
  # `deployments: read` out of the build job.
  convex-drift:
    name: Production Convex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0

      - name: Check production Convex has this commit's Convex changes
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          ALLOW_CONVEX_DRIFT: ${{ inputs.allow_convex_drift }}
        run: |
          if [ ! -f scripts/eas-build-convex-guard.mjs ]; then
            echo "::notice::No scripts/eas-build-convex-guard.mjs; production Convex drift is not checked."
            exit 0
          fi
          args=(--profile "$PROFILE")
          if [ "$ALLOW_CONVEX_DRIFT" = true ]; then args+=(--allow-convex-drift); fi
          node scripts/eas-build-convex-guard.mjs "${args[@]}"

  build:
    needs: convex-drift
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Builds that need uploaded source maps stay on the EAS cloud flow.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      ARTIFACT: APP_NAME-${{ inputs.platform }}-${{ inputs.profile }}.${{ inputs.platform == 'ios' && 'ipa' || 'apk' }}
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: inputs.platform == 'ios'
        with:
          xcode-version: latest-stable

      - run: pnpm install --frozen-lockfile

      - name: eas build --local
        working-directory: MOBILE_DIR
        run: |
          pnpm exec eas build --local --non-interactive \
            --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --output "$RUNNER_TEMP/$ARTIFACT"

      # Artifact names reject `/`, so manual runs use the run id, not the branch.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: ${{ env.ARTIFACT }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### ${{ inputs.platform }} \`${{ inputs.profile }}\` build" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download $ARTIFACT](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
