# Copy to .github/workflows/mobile-runtime.yml. Assumes the mobile target at
# apps/mobile with scripts/fingerprint.mjs from this standard.
name: Mobile runtime

# Says on each PR whether it changes the app's runtime fingerprint. If it
# does, installed builds can't load the PR as an over-the-air update and a
# new build is due after merging; if not, `pnpm mobile:update:preview` ships
# it. Informational: it never fails a PR for changing native code.
on:
  pull_request:
    paths:
      - apps/mobile/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-runtime.yml

concurrency:
  group: mobile-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      # Native modules are fingerprinted from node_modules, so both sides
      # need their own install. The second one comes from the pnpm store.
      - run: pnpm install --frozen-lockfile
      # A base without the app needs no install; fingerprint.mjs says so.
      - name: Install base
        run: |
          if [ -f .base/apps/mobile/package.json ]; then
            cd .base && pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Compare fingerprints
        run: |
          node apps/mobile/scripts/fingerprint.mjs diff .base > "$RUNNER_TEMP/runtime.md"
          cat "$RUNNER_TEMP/runtime.md" >> "$GITHUB_STEP_SUMMARY"

      # Dependabot and fork runs get a read-only token; the summary still has it.
      - name: Upsert PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- mobile-runtime -->';
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/runtime.md`, 'utf8')}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
