# Adapt APP_NAME, provider references, and the seed function before use.
# wrangler.jsonc needs a route-free env for previews:
#   "env": { "pr": { "name": "APP_NAME-pr", "workers_dev": true, "routes": [] } }
# Opt-in: deploys only while the PR carries the `preview:web` label; pushes
# redeploy, removing the label or closing the PR deletes the Worker. Close
# always cleans up, so Workers deployed before the label gate are not left behind.
# Each run creates an isolated Convex preview backend from a preview-kind
# deploy key, runs the seed function there, builds the web app against its
# URL, and deploys a per-PR Worker. Values come from repository scope as
# PREVIEW_<name>, written by `env:apply preview` (environments.md).
name: PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    # Job-level so a fully skipped run (unrelated label) cannot cancel a deploy.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      WORKER_NAME: APP_NAME-pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.PREVIEW_CONVEX_DEPLOY_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_CLERK_PUBLISHABLE_KEY }}
      # The Cloudflare Vite plugin picks the wrangler env at build time. `pr`
      # clears the production routes, so a preview never claims the domain.
      CLOUDFLARE_ENV: pr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy isolated backend and build against its URL
        run: >-
          pnpm exec convex deploy
          --preview-create pr-${{ github.event.pull_request.number }}
          --preview-run seed:seedPreview
          --cmd-url-env-var-name CONVEX_URL
          --cmd 'VITE_CONVEX_URL=$CONVEX_URL pnpm build'
      - name: Deploy isolated Worker
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --name "$WORKER_NAME" 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
      # Only when the manifest routes worker-runtime values to preview. Land each
      # of those entries on `workflow` for preview too, and map PREVIEW_<name>
      # onto <name> in this step's env.
      - name: Apply Worker runtime values
        run: node scripts/env.mjs apply preview --ci --only worker --pr ${{ github.event.pull_request.number }}
      # A preview that inherits production routes takes over the production domain.
      - name: Guard against custom domains
        run: |
          if grep -qi 'custom domain' "$RUNNER_TEMP/wrangler-deploy.log"; then
            echo "::error::The preview Worker claimed a custom domain. Redeploy production, then fix the wrangler pr env."
            exit 1
          fi
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - # Close always runs cleanup, so a PR that never deployed has no Worker.
        # Tolerate only that; any other failure must stay visible.
        run: |
          status=0; out=$(pnpm exec wrangler delete --force --name "APP_NAME-pr-${{ github.event.pull_request.number }}" 2>&1) || status=$?
          echo "$out"
          # Wrangler reports a missing Worker as code 10007 ("This Worker does not exist").
          [ "$status" -eq 0 ] || echo "$out" | grep -qE "10007|does not exist" || exit "$status"
