# Copy to .github/workflows/ci.yml. The gate is the root `verify` script, the
# same command agents run before they report done, so CI and local checks never
# drift. `verify` chains every target's check, typecheck, and tests, for example:
#   "verify": "pnpm check && pnpm typecheck && pnpm --filter ./apps/mobile typecheck && pnpm test"
# Delete the build step when the app has no build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Keep the id `check` and give the job no `name:` or matrix: the main ruleset requires
  # a status check named `check`, and Software Factory reads it as the typecheck, tests,
  # and lint gate.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Manifest and .env.example only; needs no credentials.
      - run: pnpm env:check
      # Toolkit drift (CI job name, Wrangler environments, dependency ranges). Once
      # `node scripts/check-project.mjs` shows no warnings, add:
      #   - run: node scripts/check-project.mjs --strict
      # Biome, repository checks, typecheck, and tests for every target.
      - run: pnpm verify
      # Catches bundling, plugin, and SSR-compile failures that types and tests miss.
      - run: pnpm build
