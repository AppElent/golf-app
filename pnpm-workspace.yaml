# From docs/standards/baseline/templates/pnpm-workspace.yaml. Keep every comment
# true for this app: an entry without a reason is removed at the next review.
# Web app (TanStack Start) + convex/ stay at the repo root; apps/mobile (Expo) and
# packages/core (shared, dependency-free domain logic) are workspace members.
packages:
  - "apps/*"
  - "packages/*"

# Supply-chain cooldown: refuse versions published less than 3 days ago.
# .github/dependabot.yml's cooldown (7 days) must stay at or above it.
minimumReleaseAge: 4320
# Exempt a package only with a dated reason; remove it once the version ages out.
# minimumReleaseAgeExclude:
#   - some-package # 2026-11-01: security fix not yet 3 days old

# pnpm 11 build-script ledger. Scripts are denied by default, and an install
# with an unlisted script fails with ERR_PNPM_IGNORED_BUILDS. `true` only for
# packages that compile or download a binary the app uses; keep only entries
# the lockfile actually contains.
allowBuilds:
  esbuild: true # bundler binary
  workerd: true # Cloudflare Workers runtime for wrangler and the Vite plugin
  sharp: true # wrangler/miniflare image binary, needed by the local dev server
  node-datachannel: true # Expo Device Hub's Android streaming binary
  "@sentry/cli": true # downloads sentry-cli for source-map and debug-symbol upload
  lefthook: true # postinstall installs the git hooks
  "@clerk/shared": false # postinstall is a telemetry notice
  core-js: false # postinstall is a sponsorship notice
  browser-tabs-lock: false # postinstall prints a notice (via @clerk/expo)
  dtrace-provider: false # EAS CLI's optional tracing; JS fallback is enough
  unrs-resolver: false # optional platform package supplies the binary
  "@parcel/watcher": false # jest/expo transitive; ships a prebuilt binary

# Expo's fingerprint hashes paths under node_modules/.pnpm, whose length
# defaults to 60 on Windows and 120 elsewhere. Pin it so a local build and the
# EAS builder compute the same runtime version.
virtualStoreDirMaxLength: 60

# Install before `pnpm run <script>` when node_modules is stale.
verifyDepsBeforeRun: install

# APP-71 (2026-11-13): @expo/fingerprint 0.21.7 drops every Expo module from the
# Android fingerprint (it throws on expo-widgets' Maven-only gradle plugin, which
# has no sourceDir). Fixed in 0.21.8. Remove once `expo` is 58.0.22 or later,
# which requires ^0.21.8 itself.
overrides:
  "@expo/fingerprint": "^0.21.8"
